<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magic Storybook — Horizontal Strip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="app-layout">
    <!-- Top Nav / Back to All Styles -->
    <header class="top-nav">
      <a href="../" class="back-link">‹ All Styles</a>

      <!-- Progress Track Indicator (dynamically populated) -->
      <nav class="strip-progress" id="strip-progress" aria-label="Story Progress"></nav>
    </header>

    <!-- Header / Title -->
    <div class="app-header">
      <h1 class="book-title">✨ Magic Storybook ✨</h1>
      <p class="book-subtitle">Swipe sideways to journey • Tap illustrations to lift flaps</p>
    </div>

    <!-- Main Horizontal Scrolling Strip Stage (dynamically populated from resources/story-board.json) -->
    <main class="strip-stage">
      <div class="strip-container" id="strip-container">
        <div class="strip-track" id="strip-track"></div>
      </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="controls-toolbar">
      <button id="btn-prev" class="control-btn" aria-label="Previous Scene">
        <span class="icon">◀</span>
        <span>Prev</span>
      </button>

      <div class="page-indicator" id="page-indicator">
        Cover
      </div>

      <button id="btn-next" class="control-btn" aria-label="Next Scene">
        <span>Next</span>
        <span class="icon">▶</span>
      </button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
