<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Story Cards Deck — Magic Storybook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="story-deck-app" id="story-deck-app">
    <!-- Top Story Header with Segmented Progress Bars -->
    <header class="deck-header">
      <div class="progress-segments" id="progress-segments"></div>

      <div class="header-nav">
        <a href="../" class="back-link">‹ All Styles</a>
        <div class="chapter-pill" id="chapter-pill">Start</div>
        <div class="card-counter" id="card-counter">1 / 4</div>
      </div>
    </header>

    <!-- Invisible Side Tap Zones for Story Navigation -->
    <div class="tap-zone tap-zone-left" id="tap-prev" aria-label="Previous card"></div>
    <div class="tap-zone tap-zone-right" id="tap-next" aria-label="Next card"></div>

    <!-- 3D Card Stack Stage (dynamically populated from resources/story-board.json) -->
    <main class="deck-stage" id="deck-stage"></main>

    <!-- Bottom Navigation Toolbar -->
    <footer class="deck-footer">
      <button class="nav-arrow-btn" id="btn-prev" aria-label="Previous card" disabled>◀</button>
      <span class="deck-instruction" id="footer-cue">Tap sides or use arrows</span>
      <button class="nav-arrow-btn" id="btn-next" aria-label="Next card">▶</button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
