<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Cards Deck — Sherry's Storybook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 25%, #fef3c7 0%, #fed7aa 45%, #fbcfe8 100%);
      color: #292524;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .box {
      background: rgba(255, 255, 255, 0.9);
      padding: 2.5rem;
      border-radius: 24px;
      max-width: 500px;
      box-shadow: 0 15px 35px rgba(190, 18, 60, 0.15);
    }
    h1 { font-family: 'Fredoka', cursive; color: #be123c; margin-bottom: 0.5rem; }
    p { color: #57534e; margin-bottom: 1.5rem; line-height: 1.6; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #be123c;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-weight: 700;
      font-family: 'Fredoka', cursive;
    }
    a:hover { background: #e11d48; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">✨</div>
    <h1>4. Story Cards Deck</h1>
    <p>This prototype will implement tap-to-advance story cards with progress bars. Coming in phase 4.</p>
    <a href="../">← Back to All Styles</a>
  </div>
</body>
</html>
