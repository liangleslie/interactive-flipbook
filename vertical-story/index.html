<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vertical Storyboard — Magic Storybook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="vertical-feed-app" id="vertical-feed-app">
    <!-- Floating Header -->
    <header class="feed-header">
      <a href="../" class="back-link">‹ All Styles</a>
      <div class="chapter-pill" id="chapter-pill">Start</div>
    </header>

    <!-- Right-Edge Vertical Snap Tracker Dots (dynamically populated) -->
    <div class="vertical-tracker" id="vertical-tracker" aria-label="Sections"></div>

    <!-- Vertical Snap Scroll Viewport (dynamically populated from resources/story-board.json) -->
    <main class="feed-viewport" id="feed-viewport"></main>

    <!-- Floating Bottom Navigation Bar -->
    <footer class="feed-controls">
      <button class="nav-pill-btn" id="btn-prev-section" aria-label="Previous section" disabled>▲</button>
      <span class="feed-counter" id="feed-counter">1 / 4</span>
      <button class="nav-pill-btn" id="btn-next-section" aria-label="Next section">▼</button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
