<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magic Storybook — Responsive Flipbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="app-layout">
    <!-- Top Nav / Back to All Styles -->
    <div class="top-nav">
      <a href="../" class="back-link">‹ All Styles</a>
      <div class="mobile-step-pills" id="mobile-pills"></div>
    </div>

    <!-- Header / Title -->
    <header class="app-header">
      <h1 class="book-title">✨ Magic Storybook ✨</h1>
      <p class="book-subtitle" id="book-subtitle">Click pages or use arrow keys to flip</p>
    </header>

    <!-- Book Stage (dynamically populated from resources/story-board.json) -->
    <main class="book-stage">
      <div class="book-container" id="book-container">
        <div class="c-flipbook" id="flipbook"></div>
      </div>
    </main>

    <!-- Book Controls -->
    <footer class="controls-toolbar">
      <button id="btn-prev" class="control-btn" aria-label="Previous Page">
        <span class="icon">◀</span>
        <span>Prev</span>
      </button>

      <div class="page-indicator" id="page-indicator">
        Cover
      </div>

      <button id="btn-next" class="control-btn" aria-label="Next Page">
        <span>Next</span>
        <span class="icon">▶</span>
      </button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>

</html>
